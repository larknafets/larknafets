name: update-stats
on:
  schedule:
    - cron: "0 6 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the principles are commit subjects
      - run: |
          .github/update-blocks.sh "$GITHUB_REPOSITORY_OWNER"
          .github/build.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git add README.md site blocks
          git diff --cached --quiet && exit 0
          # Commit through the API: GitHub signs these, a plain git push would be unsigned.
          # shortcut: filenames with spaces or newlines break the loop, fine for this repo.
          add=$(git diff --cached --name-only --diff-filter=AM | while read -r f; do
            jq -n --arg p "$f" --arg c "$(base64 -w0 "$f")" '{path:$p,contents:$c}'
          done | jq -s .)
          del=$(git diff --cached --name-only --diff-filter=D | jq -R '{path:.}' | jq -s .)
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" \
            --arg oid "$(git rev-parse HEAD)" --argjson add "$add" --argjson del "$del" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: "chore: refresh stats, still 200 OK"},
                expectedHeadOid: $oid,
                fileChanges: {additions: $add, deletions: $del}
              }}
            }' | gh api graphql --input -
        env:
          GH_TOKEN: ${{ github.token }}
