name: update-stats
on:
  schedule:
    - cron: "0 6 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the principles are commit subjects
      - run: |
          .github/update-blocks.sh "$GITHUB_REPOSITORY_OWNER"
          .github/build.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git add README.md site blocks
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh stats, still 200 OK"
          git push
